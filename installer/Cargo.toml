[package]
name = "mono-stt-installer"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
flate2 = { version = "1", features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "mono-stt-installer"
path = "src/main.rs"

[[bin]]
name = "mono-stt-setup"
path = "src/launcher.rs"
