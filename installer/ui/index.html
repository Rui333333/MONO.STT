<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONO.STT 安装</title><link rel="stylesheet" href="style.css"></head><body><main class="preview">
  <div class="preflight" id="preflight">
    <section data-tauri-drag-region class="preflight-card loader" id="loader" aria-labelledby="loader-title">
      <img class="small-art" src="installer.png" alt="">
      <div>
        <h2 id="loader-title">正在加载安装程序</h2>
        <div class="progress-line" id="load-progress" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="load-fill"></div>
        </div>
        <div class="progress-details"><span>正在检查安装环境</span><span class="percent" id="load-percent" aria-hidden="true">0%</span></div>
      </div>
    </section>
    <section class="preflight-card confirm" id="confirm" role="dialog" aria-labelledby="confirm-title" hidden>
      <div class="brand-pair" data-tauri-drag-region><img class="small-art" src="installer.png" alt="">MONO.STT<button class="window-close" type="button" data-close aria-label="关闭">×</button></div>
      <h2 id="confirm-title" tabindex="-1">检测到已安装的 MONO.STT</h2>
      <p id="versions"></p>
      <p>覆盖安装会沿用原安装目录，保留转录记录、设置和模型。</p>
      <label class="confirm-option"><input type="checkbox" id="overwrite-desktop"> 创建桌面快捷方式</label><div class="confirm-actions">
        <button class="secondary" type="button" id="cancel-overwrite">取消</button>
        <button class="primary" type="button" id="overwrite">确认覆盖</button>
      </div>
    </section>
    <section class="preflight-card cancelled" id="cancelled" aria-labelledby="cancelled-title" hidden>
      <h2 id="cancelled-title" tabindex="-1">无法开始安装</h2>
      <p><span id="load-error"></span></p><div class="confirm-actions"><button type="button" class="primary" id="elevate" hidden>以管理员身份继续</button><button type="button" class="primary" data-close>关闭</button></div>
    </section>
  </div>
  <section class="installer" id="installer" aria-labelledby="headline" hidden>
    <header class="installer-bar" data-tauri-drag-region>
      <span class="wordmark">MONO.STT</span>
      <div class="platform-group"><span class="platform">Windows · x64</span><button class="window-close" type="button" data-close aria-label="关闭">×</button></div>
    </header>
    <div class="main">
      <div class="copy" id="copy">
        <h1 id="headline" tabindex="-1">安装 MONO.STT</h1>
        <p id="subtitle">本地音视频转文字</p>
        <details id="directory" class="directory">
          <summary>自定义安装位置</summary>
          <label for="path">安装目录</label>
          <div class="path-row"><input id="path" type="text" spellcheck="false" autocomplete="off" aria-describedby="path-error"><button class="secondary" id="browse" type="button">浏览</button></div><label><input id="fresh-desktop" type="checkbox"> 创建桌面快捷方式</label>
          <p class="error" id="path-error" role="status" hidden></p>
        </details>
      </div>
      <figure class="art">
        <div class="art-scene">
          <img src="installer.png" alt="掀开盒盖的黑灰色 MONO.STT 安装盒" width="256" height="256">
          <div class="art-scan" aria-hidden="true"></div>
        </div>
      </figure>
    </div>
    <footer class="footer">
      <p id="footer-note">为当前 Windows 用户安装</p>
      <button id="action" class="primary" type="button">开始安装</button>
      <div class="progress" id="progress" hidden>
        <div class="progress-line" id="progress-line" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="fill"></div>
        </div>
        <div class="progress-details">
          <p id="phase" role="status">正在检查安装环境…</p>
          <span class="percent" id="percent" aria-hidden="true">0%</span>
        </div>
      </div>
    </footer>
  </section>
</main>
<script src="installer.js"></script></body></html>
