  <title>MONO.STT - 本地音视频转录工具</title>
  <style>
:root{--ink: #111318;--muted: #5b6170;--faint: #8b91a0;--line: rgba(17, 19, 24, .08);--paper: #f7f8fb;--white: #ffffff;--accent: #3b5bfd;--accent-soft: #eef1ff;--radius: 16px;--shadow: 0 18px 50px rgba(17, 19, 24, .08);--font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
img{max-width:100%}
.grid-bg{background-color:var(--paper);background-image:linear-gradient(to right,rgba(17,19,24,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(17,19,24,.045) 1px,transparent 1px);background-size:44px 44px}
.wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}
.page-shell{min-height:100vh}
.site-header{position:sticky;top:0;z-index:40;background:#ffffffeb;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:68px;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.04em}
.brand-mark{width:32px;height:32px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:22px;color:var(--muted);font-weight:600}
.nav a:hover,.nav a.router-link-active{color:var(--ink)}
.header-download{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}
.menu-btn{display:none;width:40px;height:40px;border:0;background:transparent;cursor:pointer}
.hero{padding:88px 0 72px;text-align:center}
.hero h1{font-size:clamp(40px,6vw,72px);line-height:1.12;letter-spacing:-.05em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero h1 span{color:var(--faint);font-weight:700}
.hero-lead{margin:18px auto 0;max-width:720px;color:var(--muted);font-size:clamp(16px,2vw,18px);line-height:1.7;font-weight:600}
.hero-lead span{white-space:nowrap}
.formula{margin-top:28px;font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-.04em}
.formula span{color:var(--faint);font-weight:700}
.platforms{margin:48px auto 0;display:flex;justify-content:center;gap:36px;flex-wrap:wrap}
.platform{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-weight:600;min-width:84px}
.platform svg{width:42px;height:42px}
.cta-row{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:280px;height:56px;padding:0 22px;border-radius:999px;font-weight:700;border:1px solid transparent;cursor:pointer}
.btn-dark{background:#1d1f24;color:#fff}
.btn-light{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 8px 24px #1113180a}
.kbd{margin-left:8px;min-width:28px;height:28px;padding:0 8px;border-radius:8px;background:#ffffff29;display:inline-grid;place-items:center;font-size:13px}
.btn-light .kbd{background:#f1f2f6}
.section{padding:88px 0}
.section-title{text-align:center;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em;margin-bottom:56px}
.feature{display:grid;grid-template-columns:.92fr 1.08fr;gap:48px;align-items:center;margin-bottom:88px}
.feature.reverse{grid-template-columns:1.08fr .92fr}
.feature.reverse .feature-copy{order:2}
.feature h3{font-size:32px;letter-spacing:-.04em;margin-bottom:14px}
.feature p{color:var(--muted);margin-bottom:18px}
.feature ul{list-style:none;display:grid;gap:10px;color:#2d3340}
.feature li{padding-left:18px;position:relative}
.feature li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);position:absolute;left:0;top:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pill{border:0;height:36px;padding:0 14px;border-radius:999px;background:#fff;color:var(--muted);font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.pill.active{background:var(--ink);color:#fff;box-shadow:none}
.mock{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:340px}
.mock-bar{height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--faint);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#e4e6ec}
.dot.r{background:#ff6b6b}
.dot.y{background:#ffd166}
.dot.g{background:#06d6a0}
.mock-body{display:grid;grid-template-columns:180px 1fr;min-height:298px}
.mock-side{border-right:1px solid var(--line);padding:14px;background:#fbfbfd;font-size:13px}
.mock-main{padding:16px;font-size:13px}
.side-item,.row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px}
.side-item.active,.row:nth-child(2){background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.sql{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#111318;color:#d7dce8;border-radius:10px;padding:12px;margin-top:12px;line-height:1.7}
.sql b{color:#8fb3ff;font-weight:700}
.sql em{color:#9ee7c7;font-style:normal}
.table{margin-top:12px;width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.term{background:#111318;color:#d8deea;min-height:256px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7}
.term .ok{color:#9ee7c7}
.term .cmd{color:#8fb3ff}
.marquee-wrap{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee{display:flex;gap:16px;width:max-content;animation:slide 28s linear infinite}
.marquee.alt{margin-top:16px;animation-direction:reverse}
.proto{min-width:168px;height:72px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;padding:0 18px}
@keyframes slide{0%{transform:translate(0)}
to{transform:translate(-50%)}
}
.download-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dl-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.dl-card.current{outline:2px solid var(--ink)}
.dl-card h3{font-size:28px;margin:8px 0 4px}
.dl-card p,.dl-meta{color:var(--muted);font-size:14px}
.dl-force{display:inline-flex;margin-left:8px;padding:1px 8px;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:700;vertical-align:middle}
.os-tabs{display:flex;gap:8px;margin:18px 0}
.os-tabs button{border:0;background:#f3f4f8;height:34px;padding:0 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.os-tabs button.active{background:var(--ink);color:#fff}
.dl-btn,.dl-btn-disabled{display:flex;align-items:center;justify-content:center;height:44px;border-radius:999px;font-weight:700}
.dl-btn{background:var(--ink);color:#fff}
.dl-btn-disabled{background:#eef0f5;color:var(--faint)}
.hist-more{margin:20px 0 0;text-align:center;color:var(--muted);font-size:14px}
.hist-more a{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.faq-head{text-align:center;margin-bottom:28px}
.faq-head p{color:var(--muted)}
.faq{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.faq-item+.faq-item{border-top:1px solid var(--line)}
.faq-item button{width:100%;text-align:left;background:transparent;border:0;padding:18px 22px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.faq-item .body{padding:0 22px 18px;color:var(--muted)}
.site-footer{background:#fff;border-top:1px solid var(--line);padding:56px 0 28px}
.footer-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:32px}
.site-footer h2{font-size:16px;margin-bottom:14px}
.site-footer a,.site-footer p{display:block;color:var(--muted);margin-bottom:8px}
.copy{margin-top:36px;color:var(--faint);font-size:13px}
.beian{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px}
.site-footer .beian a{display:inline;margin:0;color:var(--faint);font-size:13px;white-space:nowrap}
.subpage{padding:72px 0 96px}
.subpage h1{font-size:42px;letter-spacing:-.04em;margin-bottom:12px}
.lead{color:var(--muted);margin-bottom:32px;max-width:640px}
.card-list{display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;scroll-margin-top:88px}
.card h2{margin-bottom:8px}
.card h3{margin:16px 0 8px;font-size:15px;font-weight:700}
.card p{color:var(--muted);line-height:1.7}
.card p+p,.card ul+p{margin-top:10px}
.card ul{margin-top:12px;padding-left:18px;color:var(--muted);line-height:1.7}
.card li+li{margin-top:6px}
.card code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;padding:1px 6px;border-radius:6px;background:#0000000d}
.hist-empty{color:var(--muted);padding:24px 0}
.hist-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hist-head time{font-size:13px;color:var(--faint, #8b91a0)}
.hist-latest,.hist-force{display:inline-flex;align-items:center;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;vertical-align:middle}
.hist-latest{background:#111;color:#fff}
.hist-force{background:#fff1f0;color:#d03050}
.hist-notes{margin-top:10px}
.hist-muted{margin-top:8px}
.hist-files{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hist-file{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px}
.hist-file:hover{border-color:#111}
.hist-file span{color:var(--muted);font-size:12px}
.doc-qr{margin:18px 0 0;display:grid;justify-items:start;gap:10px}
.doc-qr img{width:220px;height:220px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.doc-qr figcaption{font-size:13px;color:var(--muted)}
.pricing-head{text-align:center;margin-bottom:36px}
.pricing-head h1{font-size:clamp(36px,5vw,52px);letter-spacing:-.04em;margin:8px 0 18px}
.pricing-head h2{font-size:28px;letter-spacing:-.03em}
.pricing-head .lead{margin:10px auto 0;text-align:center}
.pricing-kicker{color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.16em}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.price{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.price.featured{border:2px solid var(--ink)}
.price .tier{color:var(--faint);font-size:13px;font-weight:700;letter-spacing:.04em}
.price .badge{align-self:flex-start;margin-bottom:12px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.price h3{font-size:28px;margin:6px 0 14px}
.bill-toggle{display:inline-flex;gap:6px;padding:4px;border-radius:999px;background:#f3f4f8;margin-bottom:14px}
.bill-toggle button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.bill-toggle button.active{background:var(--ink);color:#fff}
.price .num{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1}
.price .num span{font-size:22px;margin-right:2px}
.price .period{margin-top:8px;color:var(--muted);font-weight:600}
.price .blurb{margin:16px 0;color:var(--muted);line-height:1.6}
.price ul{list-style:none;display:grid;gap:10px;margin-bottom:22px}
.price li{position:relative;padding-left:18px;line-height:1.5}
.price li:before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.price .dl-btn{margin-top:auto}
.pricing-team{margin-top:56px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:var(--shadow)}
.pricing-team h2{margin:8px 0 10px;font-size:28px}
.pricing-team p{color:var(--muted);max-width:640px}
.pricing-team a{display:inline-block;margin-top:18px;font-weight:700}
.pricing-faq{margin-top:64px}
.doc-nav{display:grid;grid-template-columns:220px 1fr;gap:28px}
.doc-nav aside{position:sticky;top:88px;align-self:start}
.doc-nav aside a{display:block;padding:8px 0;color:var(--muted);font-weight:600}
.doc-nav aside a:hover{color:var(--ink)}
.mobile-nav{display:none;flex-direction:column;gap:12px;padding:0 20px 18px}
@media (max-width: 900px){.nav,.header-download{display:none}
.menu-btn{display:grid;place-items:center}
.mobile-nav.open{display:flex}
.feature,.feature.reverse,.download-grid,.footer-grid,.price-grid,.doc-nav,.mock-body{grid-template-columns:1fr}
.doc-nav aside{position:static}
.feature.reverse .feature-copy{order:0}
.hero{padding-top:56px}
}
.admin-root{min-height:100vh;background:#f4f5f8}
.adm-shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.adm-side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.adm-brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;margin-bottom:22px;padding:0 8px}
.adm-side nav{display:grid;gap:2px}
.adm-ico{width:18px;height:18px;flex:none}
.adm-side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:650}
.adm-side nav a:hover{background:#f4f5f8;color:var(--ink)}
.adm-side nav a.on{background:var(--accent-soft);color:var(--accent)}
.adm-logout{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:#f4f5f8;height:40px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.adm-logout:hover{color:var(--ink)}
.adm-main{min-width:0}
.adm-top{height:60px;display:flex;align-items:center;gap:12px;padding:0 28px;background:#ffffffeb;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.adm-top strong{font-size:16px}
.adm-top span{margin-left:auto;color:var(--muted);font-size:13px;font-weight:650}
.adm-menu{display:none}
.adm-content{padding:24px 28px 40px}
.adm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.adm-stats.dense{grid-template-columns:repeat(6,minmax(0,1fr))}
.adm-stats article,.adm-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.adm-stats article{position:relative;padding-right:58px}
.adm-stat-ico{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.adm-stat-ico .adm-ico{width:18px;height:18px}
.adm-stat-ico.users{background:#eef1ff;color:var(--accent)}
.adm-stat-ico.connections{background:#eaf8f1;color:#1f8a5b}
.adm-stat-ico.ads{background:#fff3e6;color:#d97706}
.adm-stat-ico.visits{background:#f1eefe;color:#6d4dff}
.adm-stat-ico.clicks{background:#ffeef2;color:#d9486e}
.adm-stat-ico.visitors{background:#e8f4ff;color:#2b7bb9}
.adm-stats article>span:not(.adm-stat-ico),.adm-card h2{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em}
.adm-stats strong{display:block;margin:8px 0 2px;font-size:30px;letter-spacing:-.05em;line-height:1.1}
.adm-stats small,.adm-table small{color:var(--faint)}
.adm-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin:12px 0}
.adm-grid.visits{grid-template-columns:minmax(240px,.78fr) minmax(0,1.22fr);align-items:start}
.adm-grid.visits-charts{grid-template-columns:1.15fr .85fr;align-items:stretch}
.adm-chart-empty{height:220px;display:grid;place-items:center;color:var(--faint)}
.adm-vbars{height:240px;display:flex;align-items:flex-end;gap:16px;margin-top:18px;padding:0 8px 8px}
.adm-vbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.adm-vbar i{display:block;width:100%;max-width:42px;border-radius:8px 8px 4px 4px}
.adm-vbar b{font-size:12px;color:var(--ink)}
.adm-vbar span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:700}
.adm-donut{display:grid;grid-template-columns:176px minmax(0,1fr);gap:18px;align-items:center;margin-top:12px}
.adm-donut svg{width:176px;height:176px}
.adm-donut-total{font-size:22px;font-weight:800;fill:#111318}
.adm-donut-sub{font-size:11px;fill:#8b93a7}
.adm-donut ul{list-style:none;display:grid;gap:8px;max-height:220px;overflow:auto}
.adm-donut li{display:flex;align-items:center;gap:8px;font-size:13px}
.adm-donut i{width:10px;height:10px;border-radius:3px;flex:none}
.adm-donut span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.adm-donut b{font-variant-numeric:tabular-nums}
.visit-filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 12px}
.visit-filters span{color:var(--muted);font-size:13px;flex:none;line-height:42px}
.visit-range{display:flex;align-items:center;gap:8px;min-width:0}
.visit-filters select,.visit-filters input[type=date]{height:42px;border:1px solid #e4e6ee;border-radius:12px;padding:0 12px;background:#fff;color:var(--ink);font:inherit;font-size:13px;line-height:42px;outline:none;box-shadow:none;overflow:hidden}
.visit-filters select:focus,.visit-filters input[type=date]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

            <li><strong>macOS</strong>：打开 DMG，把 MONO.STT 拖入「应用程序」。当前安装包尚未完成 Apple 公证，首次打开可能出现系统提示，可在 Finder 中右键选择「打开」，或到「系统设置 → 隐私与安全性」中允许。</li>
            <li>首次启动按引导下载模型，或选择已有的模型目录，然后用内置普通话音频试转录。</li>
          </ul>

          <h3>语音模型</h3>
          <ul>
            <li><strong>Whisper Large v3 Turbo</strong>：速度与精度均衡，适合中英文日常转录。</li>
            <li><strong>Whisper Large v3</strong>：完整规模，多语种与复杂口音识别率更高。</li>
            <li>可直接下载所需权重，或关联本机已有的模型目录；下载源可在设置中切换。</li>
          </ul>
          <h3>运行设备</h3>
          <ul>
            <li><strong>CPU</strong>：纯处理器运行，不占显存，适合无独显环境；macOS 版本使用 CPU。</li>
            <li><strong>NVIDIA CUDA</strong>：Windows 上使用兼容的 GPU 加速推理，长音频处理更快，需要可用的 CUDA 运行库。</li>

          <p>模型目录可以在「偏好设置」中修改，模型文件始终保存在本机。</p>

  var el = anchor && document.getElementById(anchor);
  if (el) el.scrollIntoView({ behavior: behavior, block: 'start' });
  else window.scrollTo({ top: 0, behavior: behavior });
}

function render() {
  var route = parseRoute();
  var samePage = route.page === currentPage;
  document.title = PAGE_TITLES[route.page];
  if (!samePage) {
    var tpl = document.getElementById('page-' + route.page);
    appRoot.replaceChildren(tpl.content.cloneNode(true));
    currentPage = route.page;
    initPage();
  }
  /* 切换页面立即定位；同页锚点沿用原站的平滑滚动 */
  var behavior = samePage && route.anchor ? 'smooth' : 'instant';
  requestAnimationFrame(function () { jump(route.anchor, behavior); });
}

window.addEventListener('hashchange', render);
/* 重复点击同一 hash 不会触发 hashchange，手动滚动 */
document.addEventListener('click', function (e) {
  var a = e.target && e.target.closest ? e.target.closest('a[href^="#/"]') : null;
  if (!a || a.getAttribute('href') !== location.hash) return;
  e.preventDefault();
  jump(parseRoute().anchor, 'smooth');
});
try { if (!location.hash) history.replaceState(null, '', '#/index'); } catch (err) {}
render();

</script>
</body>
</html>
