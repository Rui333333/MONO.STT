[package]
name = "mono-stt"
version = "0.1.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.16"
hound = "3.5"
tauri-plugin-updater = "2.14"
tempfile = "3"
flate2 = { version = "1", features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
