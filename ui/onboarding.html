<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONO.STT · 首次设置</title>
<link rel="stylesheet" href="onboarding.css">
<link rel="stylesheet" href="dropdown.css">
</head>
<body>

<section class="window" id="window" aria-label="MONO.STT 首次设置">
  <aside class="rail" aria-label="设置步骤">
    <div class="brand">
      <div class="brand-mark">
        <svg aria-hidden="true" viewBox="120 168 272 176">
          <rect x="120" y="208" width="28" height="96" rx="14"/>
          <rect x="166" y="168" width="28" height="176" rx="14"/>
          <rect x="212" y="196" width="28" height="120" rx="14"/>
          <rect x="276" y="190" width="116" height="26" rx="13"/>
          <rect x="276" y="243" width="92" height="26" rx="13"/>
          <rect x="276" y="296" width="74" height="26" rx="13"/>
          <circle cx="379" cy="309" r="13"/>
        </svg>
        <span>MONO.STT</span>
      </div>
      <button type="button" class="theme-btn" id="themeToggle" title="切换浅色/深色主题" aria-label="切换主题"></button>
    </div>

    <ol class="steps" id="steps"></ol>

    <div class="rail-foot">
      <span class="dot-ok" aria-hidden="true"></span>
      <span>LOCAL · OFFLINE</span>
    </div>
  </aside>

  <main class="main">
    <div class="content" id="content"></div>
    <footer class="footer" id="actions"></footer>
  </main>
</section>



<script src="theme-transition.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
