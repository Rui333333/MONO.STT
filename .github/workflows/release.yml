name: Windows and macOS packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
      release: ${{ steps.version.outputs.release }}
      notarize: ${{ steps.apple.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the shared version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          root = Path("src-tauri")
          version = json.loads((root / "tauri.conf.json").read_text())["version"]
          package = tomllib.loads((root / "Cargo.toml").read_text())["package"]
          lock = tomllib.loads((root / "Cargo.lock").read_text())["package"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected a stable MAJOR.MINOR.PATCH version")
          if package["version"] != version or not any(
              entry["name"] == package["name"] and entry["version"] == version for entry in lock
          ):
              raise SystemExit("Tauri, Cargo and Cargo.lock versions must match")
          tagged = os.environ["GITHUB_EVENT_NAME"] == "push"
          if tagged and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Expected the release tag v{version}")
          release = tagged and os.environ["GITHUB_REPOSITORY"] == "Rui333333/MONO.STT"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"number={version}", f"release={str(release).lower()}", sep="\n", file=output)
          PY

      - name: Check Apple notarization credentials
        id: apple
        if: steps.version.outputs.release == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$CERTIFICATE" && -n "$PASSWORD" && -n "$SIGNING_IDENTITY" && -n "$API_KEY" && -n "$API_ISSUER" && -n "$API_KEY_P8" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test correction timing
        run: |
          python -B -m unittest discover -s backend -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/character-json.test.mjs
      - name: Test the application
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --bin mono-stt
      - name: Build a Windows test installer
        if: needs.version.outputs.release != 'true'
        run: ./build-windows.ps1 -Slim
      - name: Build the Windows installer with an updater signature
        if: needs.version.outputs.release == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret.' }
          ./build-windows.ps1 -Slim -Signed
      - uses: actions/upload-artifact@v4
        with:
          name: MONO.STT-Windows-x64
          path: src-tauri/target/release/bundle/windows/
          if-no-files-found: error

  macos:
    needs: version
    uses: ./.github/workflows/macos-build.yml
    with:
      release: ${{ needs.version.outputs.notarize == 'true' }}
    secrets: inherit

  draft:
    needs: [version, windows, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MONO.STT-Windows-x64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: MONO.STT-macOS-arm64
          path: macos
      - name: Attach both installers to one draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
          NOTARIZE: ${{ needs.version.outputs.notarize }}
        run: |
          set -euo pipefail
          setup="windows/MONO.STT_${VERSION}_x64-setup.exe"
          dmg="macos/MONO.STT_${VERSION}_arm64.dmg"
          updater="macos/MONO.STT_${VERSION}_arm64.app.tar.gz"
          assets=("$setup" "$setup.sig" latest.json "$dmg")
          if [[ "$NOTARIZE" == true ]]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${updater##*/}"
            jq --arg url "$url" --arg signature "$(cat "$updater.sig")" \
              '.platforms["darwin-aarch64"] = {url: $url, signature: $signature}' \
              windows/latest.json > latest.json
            assets+=("$updater" "$updater.sig")
          else
            cp windows/latest.json latest.json
          fi
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" = true ]; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Release $GITHUB_REF_NAME is already published."
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "MONO.STT $VERSION"
          fi
